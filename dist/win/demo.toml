# OpenComp demo — layered solids + keyframes
# Four layers: backdrop, left card, keyframed right card (slides + rotates),
# center strip with a rotation expression and an opacity pulse.

[project]
name     = "demo"
fps      = 24
width    = 640
height   = 480
duration = 120
bg_color = "#0a0a0a"

[[layer]]
name  = "backdrop"
type  = "solid"
color = "#1a2b3c"
size  = [600.0, 440.0]

[layer.transform]
position = [320.0, 240.0]

[[layer]]
name = "left_card"
type = "solid"
color = "#e63946"
size = [160.0, 220.0]

[layer.transform]
position = [180.0, 240.0]

[[layer]]
name = "right_card"
type = "solid"
color = "#457b9d"
size = [160.0, 220.0]

[layer.transform]
position = [460.0, 240.0]
rotation = 15.0

[[layer.keyframe]]
property = "position"
time = 0
value = [460.0, 140.0]
easing = "ease_in_out"

[[layer.keyframe]]
property = "position"
time = 120
value = [460.0, 340.0]

[[layer.keyframe]]
property = "rotation"
time = 0
value = 15.0

[[layer.keyframe]]
property = "rotation"
time = 120
value = -15.0
easing = "ease_in_out"

[[layer]]
name = "center_strip"
type = "solid"
color = "#f4a26180"

[layer.transform]
position = [320.0, 240.0]
scale = [1.0, 0.35]
opacity = 70.0

[[layer.keyframe]]
property = "opacity"
time = 0
value = 40.0

[[layer.keyframe]]
property = "opacity"
time = 60
value = 90.0
easing = "ease_in_out"

[[layer.keyframe]]
property = "opacity"
time = 120
value = 40.0
easing = "ease_out"

[[layer.expression]]
property = "rotation"
expr = "frame * 2.0"